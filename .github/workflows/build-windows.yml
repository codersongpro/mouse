# ClassZoom — Windows·맥 빌드 / 배포
#
# - main에 올릴 때마다: Windows(문법 검사 → exe 컴파일 → zip)와 맥(swiftc → .app → zip)을 만들어
#   "Artifacts"로 올림 (Actions 탭에서 받기)
# - v로 시작하는 태그(예: v1.0.0)를 올리면: 위와 같이 만든 zip으로 GitHub 릴리스를 만듦
# - Actions 탭에서 "Run workflow"로 손으로 돌릴 수도 있음. 이때 release를 체크하면
#   태그 v<APP_VERSION>과 릴리스를 Actions가 직접 만든다 (태그를 올릴 수 없는 환경용)
#
# 버전 번호는 windows/classzoom.ahk의 APP_VERSION에서 읽고, 맥 Info.plist의 버전도 같아야 한다.
# 태그를 달 때는 태그(v1.0.0)와 APP_VERSION(1.0.0)이 같아야 한다 — 다르면 멈춘다.

name: Build ClassZoom

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "빌드한 zip으로 릴리스를 게시 (태그 v<APP_VERSION>도 함께 만듦)"
        type: boolean
        default: false

permissions:
  contents: write # 릴리스를 만들 때만 쓴다

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: |
          $m = Select-String -Path windows/classzoom.ahk -Pattern '^APP_VERSION := "([^"]+)"' | Select-Object -First 1
          if (-not $m) { throw "APP_VERSION not found" }
          $v = $m.Matches[0].Groups[1].Value
          $sv = Select-String -Path windows/classzoom.ahk -Pattern '^;@Ahk2Exe-SetVersion (.+)$' | Select-Object -First 1
          if ($sv.Matches[0].Groups[1].Value.Trim() -ne $v) { throw "SetVersion and APP_VERSION differ" }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$v") {
            throw "Tag $env:GITHUB_REF_NAME does not match APP_VERSION $v"
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version $v"

      - name: Download AutoHotkey v2 and Ahk2Exe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force tools/ahk, tools/ahk2exe | Out-Null
          # autohotkey.com은 CI 서버의 내려받기를 막으므로(Cloudflare) 공식 GitHub 릴리스에서 받는다.
          # 익명 API는 호출 횟수 제한에 걸리므로 인증된 gh를 쓴다.
          gh release download -R AutoHotkey/AutoHotkey -D tools -p 'AutoHotkey_2*.zip'
          gh release download -R AutoHotkey/Ahk2Exe -D tools -p 'Ahk2Exe*.zip'
          $ahkZip = Get-ChildItem tools -Filter 'AutoHotkey_2*.zip' | Select-Object -First 1
          $a2eZip = Get-ChildItem tools -Filter 'Ahk2Exe*.zip' | Select-Object -First 1
          if (-not $ahkZip -or -not $a2eZip) { throw "AutoHotkey download failed" }
          Write-Host "$($ahkZip.Name) / $($a2eZip.Name)"
          Expand-Archive $ahkZip.FullName tools/ahk -Force
          Expand-Archive $a2eZip.FullName tools/ahk2exe -Force
          Get-ChildItem tools/ahk -Filter AutoHotkey64.exe -Recurse | Select-Object -First 1 | ForEach-Object { "AHK_EXE=$($_.FullName)" >> $env:GITHUB_ENV }
          Get-ChildItem tools/ahk2exe -Filter Ahk2Exe.exe -Recurse | Select-Object -First 1 | ForEach-Object { "AHK2EXE=$($_.FullName)" >> $env:GITHUB_ENV }

      # 스크립트를 실행하지 않고 읽어 들이기만 해서 문법·#Include 오류를 잡는다
      - name: Validate script
        run: |
          $p = Start-Process $env:AHK_EXE -ArgumentList '/ErrorStdOut=UTF-8', '/validate', 'classzoom.ahk' `
            -WorkingDirectory windows -Wait -PassThru -NoNewWindow -RedirectStandardError validate.log
          Get-Content validate.log -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "Script validation failed ($($p.ExitCode))" }

      - name: Compile exe
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $out = Join-Path $PWD 'dist/classzoom.exe'
          $p = Start-Process $env:AHK2EXE -ArgumentList '/in', 'classzoom.ahk', '/out', "`"$out`"", '/base', "`"$env:AHK_EXE`"", '/silent', 'verbose' `
            -WorkingDirectory windows -Wait -PassThru -NoNewWindow -RedirectStandardOutput compile.log
          Get-Content windows/compile.log, compile.log -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0 -or -not (Test-Path $out)) { throw "Compile failed ($($p.ExitCode))" }
          Get-Item $out | Format-List Name, Length, VersionInfo

      # 녹화 도우미: .NET Framework 4의 C# 컴파일러(Windows에 기본 포함)로 빌드한다
      - name: Build recorder helper
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /target:winexe /optimize+ /out:dist\classzoom-rec.exe windows\recorder\ClassZoomRec.cs
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path dist\classzoom-rec.exe)) { throw "Recorder build failed" }
          Get-Item dist\classzoom-rec.exe | Format-List Name, Length

      # 녹화 엔진: FFmpeg LGPL 빌드 (BtbN/FFmpeg-Builds). ffmpeg.exe와 라이선스만 쓴다.
      - name: Download FFmpeg (LGPL)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 인증된 gh로 받는다 (익명 API는 호출 횟수 제한에 자주 걸린다). 안정판(n…)이 여럿이면 가장 높은 판.
          New-Item -ItemType Directory -Force tools/ffdl | Out-Null
          gh release download latest -R BtbN/FFmpeg-Builds -D tools/ffdl -p 'ffmpeg-n*-latest-win64-lgpl-[0-9]*.zip'
          $zip = Get-ChildItem tools/ffdl -Filter *.zip | Where-Object { $_.Name -notmatch 'shared' } |
            Sort-Object { [version](($_.Name -replace '^ffmpeg-n([\d.]+)-.*$', '$1') + '.0') } -Descending | Select-Object -First 1
          if (-not $zip) {
            Write-Host "Stable build not found, using master build"
            Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip -OutFile tools/ffdl/ffmpeg-master-latest-win64-lgpl.zip
            $zip = Get-Item tools/ffdl/ffmpeg-master-latest-win64-lgpl.zip
          }
          Write-Host "FFmpeg $($zip.Name)"
          Expand-Archive $zip.FullName tools/ffmpeg -Force
          $asset = @{ name = $zip.Name }
          $exe = Get-ChildItem tools/ffmpeg -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          $lic = Get-ChildItem tools/ffmpeg -Filter LICENSE.txt -Recurse | Select-Object -First 1
          Copy-Item $exe.FullName dist\ffmpeg.exe
          Copy-Item $lic.FullName dist\FFmpeg-LICENSE.txt
          & dist\ffmpeg.exe -hide_banner -version | Select-Object -First 1 | Tee-Object -FilePath dist\ffmpeg-version.txt
          $enc = & dist\ffmpeg.exe -hide_banner -encoders 2>$null | Select-String 'h264_mf|aac |mpeg4 '
          $enc | ForEach-Object { Write-Host $_ }
          "asset=$($asset.name)" >> $env:GITHUB_ENV

      # 실제로 5초 녹화해 본다 (빌드 서버에는 소리 장치가 없어 화면만 녹화된다)
      - name: Smoke test recording
        continue-on-error: true
        run: |
          $t = Join-Path $env:RUNNER_TEMP 'rec'
          New-Item -ItemType Directory -Force $t | Out-Null
          $out = Join-Path $t 'test.mp4'
          Set-Content -Path "$t\ctl" -Value 'rec' -NoNewline
          $p = Start-Process dist\classzoom-rec.exe -PassThru -ArgumentList "--ffmpeg=$PWD\dist\ffmpeg.exe", "--out=$out", "--control=$t\ctl", "--status=$t\status", "--log=$t\log", '--x=0', '--y=0', '--w=640', '--h=480', '--fps=15', '--mic=1', '--sys=1'
          Start-Sleep 3
          Set-Content -Path "$t\ctl" -Value 'pause' -NoNewline
          Start-Sleep 1
          Set-Content -Path "$t\ctl" -Value 'rec' -NoNewline
          Start-Sleep 3
          Set-Content -Path "$t\ctl" -Value 'stop' -NoNewline
          $p.WaitForExit(90000) | Out-Null
          Write-Host "--- status"; Get-Content "$t\status" -ErrorAction SilentlyContinue
          Write-Host "--- log"; Get-Content "$t\log" -ErrorAction SilentlyContinue
          if (-not (Test-Path $out)) { Write-Host "::warning::Smoke test produced no video"; exit 1 }
          Get-Item $out | Format-List Name, Length
          & dist\ffmpeg.exe -hide_banner -i $out 2>&1 | Select-String 'Duration|Stream'
          exit 0 # 위 ffmpeg -i는 출력 파일이 없어 늘 1로 끝난다 (정보만 본다)

      - name: Package zip
        id: pkg
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          $dir = 'dist/ClassZoom'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Move-Item dist/classzoom.exe $dir
          Move-Item dist/classzoom-rec.exe $dir
          Move-Item dist/ffmpeg.exe $dir
          Copy-Item windows/사용안내.txt $dir
          Copy-Item LICENSE "$dir/LICENSE.txt"
          # FFmpeg은 LGPL 2.1로 배포된다: 라이선스 전문과 출처를 함께 넣는다
          New-Item -ItemType Directory -Force "$dir/licenses" | Out-Null
          Move-Item dist/FFmpeg-LICENSE.txt "$dir/licenses/FFmpeg-LICENSE.txt"
          $ffver = Get-Content dist/ffmpeg-version.txt -Raw
          @"
          ClassZoom은 화면 녹화에 FFmpeg(ffmpeg.exe)을 사용합니다.
          FFmpeg is licensed under the GNU Lesser General Public License (LGPL) version 2.1.
          $ffver
          Build: $env:asset  (https://github.com/BtbN/FFmpeg-Builds)
          Source code: https://ffmpeg.org/download.html  /  https://github.com/FFmpeg/FFmpeg
          ffmpeg.exe는 수정하지 않은 그대로이며, 같은 이름의 다른 FFmpeg 빌드로 바꿔 써도 됩니다.
          "@ -replace '(?m)^\s+', '' | Set-Content "$dir/licenses/THIRD-PARTY.txt" -Encoding utf8
          $zip = "dist/ClassZoom-$v.zip"
          Compress-Archive -Path $dir -DestinationPath $zip -Force
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
          "zip=$zip" >> $env:GITHUB_OUTPUT
          "sha=$hash" >> $env:GITHUB_OUTPUT
          Write-Host "$zip  SHA-256 $hash"

      - uses: actions/upload-artifact@v4
        with:
          name: ClassZoom-${{ steps.ver.outputs.version }}
          path: ${{ steps.pkg.outputs.zip }}

  # ---------------- 맥 ----------------
  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Check version
        run: |
          W=$(sed -n 's/^APP_VERSION := "\([^"]*\)".*/\1/p' windows/classzoom.ahk)
          M=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" mac/Info.plist)
          echo "Windows $W / mac $M"
          [ "$W" = "$M" ] || { echo "::error::mac/Info.plist 버전($M)이 APP_VERSION($W)과 다릅니다"; exit 1; }
      - name: Build app
        run: mac/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ClassZoom-mac
          path: mac/build/ClassZoom-*-mac.zip

  # ---------------- 릴리스 (두 판이 모두 성공했을 때) ----------------
  release:
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.release)
    needs: [build, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          ls -la dist
          TAG="v$VERSION"
          [ "$GITHUB_REF_TYPE" = tag ] && TAG="$GITHUB_REF_NAME"
          WIN="dist/ClassZoom-$VERSION.zip"; MAC="dist/ClassZoom-$VERSION-mac.zip"
          cat > notes.md <<NOTES
          ClassZoom $VERSION — 라이브 줌 · 마우스 하이라이트 · 드로잉 · 화면 녹화

          **Windows 10 / 11:** \`ClassZoom-$VERSION.zip\`을 받아 압축을 풀고 \`classzoom.exe\`를 실행하세요. 파란 "Windows의 PC 보호" 창이 뜨면 **추가 정보 → 실행**을 누르세요.

          **macOS 14 이상:** \`ClassZoom-$VERSION-mac.zip\`을 받아 \`ClassZoom.app\`을 응용 프로그램 폴더로 옮긴 뒤 여세요. 처음 한 번은 시스템 설정 › 개인정보 보호 및 보안에서 **그래도 열기**를 누르고, 라이브 줌·녹화를 쓰려면 **화면 및 시스템 오디오 녹화** 권한을 켜 주세요.

          - F7: 라이브 줌 3단계 (누를 때마다 1→2→3단계→끄기), F8: 마우스 하이라이트, F9: 드로잉, F10: 화면 녹화
          - 화면 공유·녹화에 확대 화면이 그대로 보이고 커서는 하나만 보입니다

          SHA-256
          - Windows: $(sha256sum "$WIN" | cut -d' ' -f1)
          - macOS: $(sha256sum "$MAC" | cut -d' ' -f1)
          NOTES
          sed -i 's/^          //' notes.md
          gh release create "$TAG" "$WIN" "$MAC" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "ClassZoom $TAG" --notes-file notes.md
